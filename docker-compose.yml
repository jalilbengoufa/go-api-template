name: go-api-template

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-api}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-api}
      POSTGRES_DB: ${PG_DB:-api}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-api} -d ${PG_DB:-api}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      APP_ENV: development
      APP_PORT: 8080
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:-api}
      PG_PASSWORD: ${PG_PASSWORD:-api}
      PG_DB: ${PG_DB:-api}
      PG_SSL_MODE: disable
      AUTH_DISABLED: ${AUTH_DISABLED:-true}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN:-}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE:-}
      LOG_LEVEL: debug
      LOG_FORMAT: text

volumes:
  postgres-data:
